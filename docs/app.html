<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nazarene for she Organisation — Workflow</title>
  <style>
    html, body { margin: 0; height: 100%; background: #3f1344; }
    .bar {
      position: fixed; left: 0; right: 0; top: 0; z-index: 2;
      display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; justify-content: space-between;
      padding: 0.5rem 0.75rem; background: rgba(63, 19, 68, 0.94); color: #fff;
      font-family: system-ui, sans-serif; font-size: 0.85rem;
    }
    .bar a { color: #ffd9ff; }
    .frame-wrap { position: fixed; left: 0; right: 0; top: 42px; bottom: 0; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  </style>
  <script>
    var EXEC_URL = 'https://script.google.com/macros/s/AKfycbyADy_1Hwe2qb6FwGtcc5bOkMvvvp5HxNxeDW7OIp88SG0lrF3Ou5_MGRUGnTJ5TDyL/exec';

    function cleanExecUrl(url) {
      return String(url || '').replace(/\/macros\/u\/\d+\//, '/macros/');
    }

    window.addEventListener('DOMContentLoaded', function () {
      var exec = cleanExecUrl(EXEC_URL);
      var email = '';
      try { email = localStorage.getItem('naz_preferred_email') || ''; } catch (e) {}
      if (email) {
        exec += (exec.indexOf('?') >= 0 ? '&' : '?') + 'authuser=' + encodeURIComponent(email);
      }
      document.getElementById('openRaw').href = exec;
      document.getElementById('appFrame').src = exec;
    });
  </script>
</head>
<body>
  <div class="bar">
    <span>Nazarene for she Organisation</span>
    <span>
      <a id="openRaw" href="#" target="_blank" rel="noopener">Open in new tab</a>
      ·
      <a href="./open.html">Switch account / settings</a>
    </span>
  </div>
  <div class="frame-wrap">
    <iframe id="appFrame" title="SHE Workflow" allow="clipboard-read; clipboard-write"></iframe>
  </div>
</body>
</html>

<style>
  :root {
    --ink: #1a121c;
    --muted: #6a5b6e;
    --paper: #faf7fb;
    --panel: rgba(255, 252, 255, 0.94);
    --line: #e4d6ea;
    --brand: #5e2063;
    --brand-deep: #3f1344;
    --brand-soft: #f3e8f5;
    --amber: #c47a2c;
    --danger: #9b2c2c;
    --ok: #1f6b45;
    --shadow: 0 18px 50px rgba(60, 20, 70, 0.12);
    --radius: 14px;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Outfit", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--paper);
    line-height: 1.45;
  }

  .bg-wash {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(900px 480px at 8% -10%, rgba(94, 32, 99, 0.16), transparent 60%),
      radial-gradient(700px 420px at 100% 0%, rgba(196, 122, 44, 0.1), transparent 55%),
      linear-gradient(180deg, #f7f0f8 0%, #faf7fb 45%, #f3eef6 100%);
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding: 1.1rem 1.5rem;
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(8px);
    background: rgba(255,255,255,0.55);
  }
  .brand { display: flex; gap: 0.85rem; align-items: center; min-width: 0; }
  .brand-logo {
    width: 56px;
    height: 56px;
    object-fit: contain;
    border-radius: 12px;
    background: #fff;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .brand-mark {
    width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(145deg, var(--brand) 0%, var(--brand-deep) 100%);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.12);
  }
  .brand-eyebrow {
    margin: 0;
    font-size: 0.78rem;
    font-style: italic;
    color: var(--brand);
    font-family: var(--font-display);
  }
  .brand-title {
    margin: 0.15rem 0 0;
    font-family: var(--font-display);
    font-size: clamp(1.05rem, 2.5vw, 1.4rem);
    font-weight: 700;
    color: var(--ink);
  }
  .user-chip {
    font-size: 0.85rem;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 0.45rem 0.75rem;
    border-radius: 999px;
    max-width: min(360px, 48vw);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .shell { max-width: 980px; margin: 0 auto; padding: 1.25rem 1.25rem 3rem; }
  .tabs { display: flex; gap: 0.4rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .tab {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    padding: 0.55rem 0.95rem;
    border-radius: 999px;
    font: inherit;
    font-weight: 560;
    cursor: pointer;
  }
  .tab.active {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1.25rem 1.35rem 1.5rem;
    box-shadow: var(--shadow);
  }
  h2, h3 { font-family: var(--font-display); margin: 0 0 0.35rem; }
  .section-title {
    margin: 1.35rem 0 0.65rem;
    font-size: 1.05rem;
    color: var(--brand-deep);
  }
  .lede { margin: 0 0 1rem; color: var(--muted); }
  .muted { color: var(--muted); }

  .dash-head {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }

  .field { margin-bottom: 0.9rem; }
  label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.3rem; }
  input, select, textarea {
    width: 100%;
    font: inherit;
    padding: 0.65rem 0.75rem;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
  }
  textarea { resize: vertical; }

  .btn {
    font: inherit;
    font-weight: 600;
    border-radius: 10px;
    padding: 0.65rem 1rem;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-deep); }
  .btn.secondary { background: #fff; border-color: var(--line); color: var(--ink); }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .actions-row { display: flex; gap: 0.6rem; flex-wrap: wrap; margin: 0.75rem 0 1rem; }

  .setup-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 0.75rem 1rem;
    margin-bottom: 0.75rem;
  }
  .role-card, .member-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0.75rem;
    background: rgba(255,255,255,0.72);
  }
  .role-card h4, .member-card h4 { margin: 0 0 0.5rem; font-size: 0.95rem; }
  .member-card .row-actions { display: flex; justify-content: flex-end; }
  .members-list { display: flex; flex-direction: column; gap: 0.65rem; }

  .item-list { display: flex; flex-direction: column; gap: 0.75rem; }
  .item {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0.9rem 1rem;
    background: #fff;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .item:hover { border-color: var(--brand); transform: translateY(-1px); }
  .item-top { display: flex; justify-content: space-between; gap: 0.75rem; align-items: flex-start; }
  .item-title { margin: 0; font-size: 1.05rem; font-family: var(--font-display); }
  .badge {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0.25rem 0.5rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.pending { background: #fff1dc; color: #8a4f10; }
  .badge.approved { background: #e2f5ea; color: var(--ok); }
  .badge.declined { background: #fde8e8; color: var(--danger); }
  .item-meta { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.9rem; }
  .stage-rail {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
    margin-top: 0.65rem;
  }
  .stage-pill {
    font-size: 0.75rem;
    padding: 0.2rem 0.5rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .stage-pill.done { background: #e2f5ea; border-color: #b7e0c7; color: var(--ok); }
  .stage-pill.current { background: var(--brand-soft); border-color: #d4b4da; color: var(--brand-deep); font-weight: 600; }

  .msg { margin-top: 0.75rem; padding: 0.65rem 0.75rem; border-radius: 10px; }
  .msg.ok { background: #e2f5ea; color: var(--ok); }
  .msg.err { background: #fde8e8; color: var(--danger); }

  .dialog {
    border: none;
    border-radius: 16px;
    padding: 0;
    width: min(560px, calc(100vw - 2rem));
    box-shadow: var(--shadow);
  }
  .dialog::backdrop { background: rgba(40, 16, 48, 0.45); }
  .dialog-inner { padding: 1rem 1.1rem 1.15rem; }
  .dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
  .icon-close {
    border: none; background: transparent; font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--muted);
  }
  .dialog-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end; margin-top: 0.85rem; }
  .kv { margin: 0.35rem 0; font-size: 0.92rem; }
  .kv span { color: var(--muted); }

  @media (max-width: 640px) {
    .topbar { align-items: flex-start; flex-direction: column; }
    .user-chip { max-width: 100%; }
  }
</style>

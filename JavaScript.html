<script>
  var state = {
    bootstrap: null,
    items: [],
    selected: null,
    noteMode: null,
    pendingLogo: null
  };

  function $(id) { return document.getElementById(id); }

  function run(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    var timeoutMs = args.length && typeof args[args.length - 1] === 'object' && args[args.length - 1] && args[args.length - 1].__timeoutMs
      ? args.pop().__timeoutMs
      : 28000;
    return new Promise(function (resolve, reject) {
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        reject(new Error('Request timed out. If you deleted Drive/DB, open Setup and recreate them.'));
      }, timeoutMs);
      google.script.run
        .withSuccessHandler(function (res) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (res && res.ok === false) reject(new Error(res.error || 'Request failed'));
          else resolve(res && res.data !== undefined ? res.data : res);
        })
        .withFailureHandler(function (err) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          reject(err);
        })[fnName].apply(null, args);
    });
  }

  function showView(name) {
    ['Loading', 'Setup', 'Dashboard', 'Submit'].forEach(function (v) {
      var el = $('view' + v);
      if (el) el.hidden = v.toLowerCase() !== name;
    });
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('active', t.getAttribute('data-view') === name);
    });
  }

  function setMsg(el, text, ok) {
    if (!el) return;
    el.hidden = !text;
    el.textContent = text || '';
    el.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  function fileToPayload(file) {
    return new Promise(function (resolve, reject) {
      if (!file) return reject(new Error('No file selected'));
      if (file.size > 35 * 1024 * 1024) {
        return reject(new Error('File too large (max ~35MB for this upload path).'));
      }
      var reader = new FileReader();
      reader.onload = function () {
        var result = reader.result || '';
        var base64 = String(result).split(',')[1] || '';
        resolve({
          fileBase64: base64,
          fileName: file.name,
          mimeType: file.type || 'application/octet-stream'
        });
      };
      reader.onerror = function () { reject(new Error('Could not read file')); };
      reader.readAsDataURL(file);
    });
  }

  function applyBranding(branding) {
    branding = branding || {};
    $('brandTitle').textContent = branding.orgName || 'Nazarene for she Organisation';
    $('brandSlogan').textContent = branding.slogan || 'She empowered, Community inspired.';
    document.title = branding.orgName || 'Nazarene for she Organisation';
    if (branding.logoDataUrl) {
      $('brandLogo').src = branding.logoDataUrl;
      $('brandLogo').alt = branding.orgName || 'Nazarene for She';
      $('brandLogo').hidden = false;
      $('brandMark').hidden = true;
    } else {
      $('brandLogo').hidden = true;
      $('brandMark').hidden = false;
    }
  }

  function showAuthBanner(message, chooserUrl) {
    var banner = $('authBanner');
    if (banner) banner.hidden = false;
    if ($('appMain')) $('appMain').hidden = true;
    if ($('navTabs')) $('navTabs').hidden = true;
    if ($('authBannerText') && message) {
      $('authBannerText').textContent = message;
    }
    if ($('userChip')) $('userChip').textContent = 'Not signed in';
  }

  function hideAuthBanner() {
    if ($('authBanner')) $('authBanner').hidden = true;
    if ($('appMain')) $('appMain').hidden = false;
    setMsg($('loginMsg'), '', true);
  }

  function finishBootError(msg, chooser) {
    var clean = String(msg || '').replace(/^IDENTITY_REQUIRED:\s*/i, '');
    showAuthBanner(clean || undefined);
    if ($('viewLoading')) {
      $('viewLoading').innerHTML = '';
      $('viewLoading').hidden = true;
    }
  }
  function renderSetupForm(setup) {
    var form = $('setupForm');
    form.innerHTML = '';
    var labels = setup.roleLabels || {};
    var roles = setup.roles || {};
    var officerRoles = setup.officerRoles || Object.keys(labels);
    officerRoles.forEach(function (role) {
      var card = document.createElement('div');
      card.className = 'role-card';
      var entry = roles[role] || { email: '', whatsapp: '' };
      card.innerHTML =
        '<h4>' + escapeHtml(labels[role] || role) + '</h4>' +
        '<div class="field"><label>Full name</label>' +
        '<input data-role="' + role + '" data-field="name" type="text" value="' + escapeAttr(entry.name || '') + '" placeholder="Display name for emails & history" /></div>' +
        '<div class="field"><label>Email</label>' +
        '<input data-role="' + role + '" data-field="email" type="email" value="' + escapeAttr(entry.email || '') + '" /></div>' +
        '<div class="field"><label>WhatsApp (with country code)</label>' +
        '<input data-role="' + role + '" data-field="whatsapp" type="text" value="' + escapeAttr(entry.whatsapp || '') + '" placeholder="+2547…" /></div>';
      form.appendChild(card);
    });

    renderMembers(setup.members || []);
    $('orgSlogan').value = (setup.branding && setup.branding.slogan) || 'She empowered, Community inspired.';
    $('whatsappMode').value = setup.whatsappMode || 'off';
    $('whatsappWebhookUrl').value = setup.whatsappWebhookUrl || '';
    $('webAppUrl').value = setup.webAppUrl || '';
    if (setup.accountChooserUrl) {
      $('accountChooserLink').href = setup.accountChooserUrl;
    }
  }

  function renderMembers(members) {
    var root = $('membersList');
    root.innerHTML = '';
    if (!members.length) members = [{ name: '', email: '', whatsapp: '' }];
    members.forEach(function (m, idx) {
      root.appendChild(memberCard(m, idx));
    });
  }

  function memberCard(m, idx) {
    var card = document.createElement('div');
    card.className = 'member-card';
    card.innerHTML =
      '<h4>Member ' + (idx + 1) + '</h4>' +
      '<div class="field"><label>Name</label><input data-member="name" type="text" value="' + escapeAttr(m.name || '') + '" /></div>' +
      '<div class="field"><label>Email</label><input data-member="email" type="email" value="' + escapeAttr(m.email || '') + '" /></div>' +
      '<div class="field"><label>WhatsApp</label><input data-member="whatsapp" type="text" value="' + escapeAttr(m.whatsapp || '') + '" placeholder="+2547…" /></div>' +
      '<div class="row-actions"><button type="button" class="btn secondary btn-remove-member">Remove</button></div>';
    card.querySelector('.btn-remove-member').addEventListener('click', function () {
      card.remove();
      renumberMembers();
    });
    return card;
  }

  function renumberMembers() {
    $('membersList').querySelectorAll('.member-card h4').forEach(function (h, i) {
      h.textContent = 'Member ' + (i + 1);
    });
  }

  function collectRoles() {
    var roles = {};
    $('setupForm').querySelectorAll('[data-role]').forEach(function (input) {
      var role = input.getAttribute('data-role');
      var field = input.getAttribute('data-field');
      if (!roles[role]) roles[role] = { name: '', email: '', whatsapp: '' };
      roles[role][field] = input.value.trim();
    });
    return roles;
  }

  function collectMembers() {
    var out = [];
    $('membersList').querySelectorAll('.member-card').forEach(function (card) {
      out.push({
        name: (card.querySelector('[data-member="name"]') || {}).value || '',
        email: (card.querySelector('[data-member="email"]') || {}).value || '',
        whatsapp: (card.querySelector('[data-member="whatsapp"]') || {}).value || ''
      });
    });
    return out.map(function (m) {
      return {
        name: String(m.name).trim(),
        email: String(m.email).trim(),
        whatsapp: String(m.whatsapp).trim()
      };
    }).filter(function (m) { return m.email || m.whatsapp; });
  }

  function renderSubmitOptions(canSubmit) {
    var sel = $('docType');
    sel.innerHTML = '';
    var options = [
      { key: 'requisition', label: 'Requisition' },
      { key: 'minutes', label: 'Minutes' },
      { key: 'proof_of_payment', label: 'Proof of Payment' }
    ];
    var any = false;
    options.forEach(function (o) {
      if (canSubmit && canSubmit[o.key]) {
        any = true;
        var opt = document.createElement('option');
        opt.value = o.key;
        opt.textContent = o.label;
        sel.appendChild(opt);
      }
    });
    $('tabSubmit').hidden = !any;
    return any;
  }

  function renderItems() {
    var type = $('filterType').value;
    var status = $('filterStatus').value;
    var list = (state.items || []).filter(function (i) {
      if (type && i.type !== type) return false;
      if (status && i.status !== status) return false;
      return true;
    });
    var root = $('itemList');
    root.innerHTML = '';
    if (!list.length) {
      root.innerHTML = '<p class="muted">No documents match these filters.</p>';
      return;
    }
    list.forEach(function (item) {
      var el = document.createElement('article');
      el.className = 'item';
      el.innerHTML =
        '<div class="item-top">' +
          '<h3 class="item-title">' + escapeHtml(item.title) + '</h3>' +
          '<span class="badge ' + escapeAttr(item.status) + '">' + escapeHtml(item.status) + '</span>' +
        '</div>' +
        '<p class="item-meta">' + escapeHtml(item.typeLabel) + ' · ' + escapeHtml(item.progress) + '</p>' +
        '<div class="stage-rail">' + renderStagePills(item) + '</div>';
      el.addEventListener('click', function () { openDetail(item); });
      root.appendChild(el);
    });
  }

  function renderStagePills(item) {
    var idx = item.currentStageIndex || 0;
    return (item.stages || []).map(function (s, i) {
      var cls = 'stage-pill';
      if (item.status === 'approved' || i < idx) cls += ' done';
      else if (item.status === 'pending' && i === idx) cls += ' current';
      return '<span class="' + cls + '">' + escapeHtml(s.label) + '</span>';
    }).join('');
  }

  function openDetail(item) {
    state.selected = item;
    $('dlgTitle').textContent = item.title;
    var body = $('dlgBody');
    var submitterLabel = item.submitterName
      ? (item.submitterName + ' <' + item.submitterEmail + '>')
      : (item.submitterEmail || '');
    var declinedLabel = item.declinedByName
      ? (item.declinedByName + (item.declinedBy ? ' <' + item.declinedBy + '>' : ''))
      : (item.declinedBy || '');
    body.innerHTML =
      '<p class="kv"><span>Type:</span> ' + escapeHtml(item.typeLabel) + '</p>' +
      '<p class="kv"><span>Status:</span> ' + escapeHtml(item.progress) + '</p>' +
      '<p class="kv"><span>Submitted by:</span> ' + escapeHtml(submitterLabel) + '</p>' +
      '<p class="kv"><span>File:</span> <a href="' + escapeAttr(item.fileUrl) + '" target="_blank" rel="noopener">' + escapeHtml(item.fileName) + '</a></p>' +
      (item.declineNote
        ? '<p class="kv"><span>Decline note:</span> ' + escapeHtml(item.declineNote) + ' <em>(' + escapeHtml(declinedLabel) + ')</em></p>'
        : '') +
      '<div class="stage-rail" style="margin-top:0.75rem">' + renderStagePills(item) + '</div>' +
      renderHistory(item);

    var actions = $('dlgActions');
    actions.innerHTML = '';
    var p = item.permissions || {};
    if (p.canApprove) actions.appendChild(actionBtn('Approve', 'primary', function () { doApprove(item.id); }));
    if (p.canDecline) actions.appendChild(actionBtn('Decline…', 'danger', function () { openNote('decline', item); }));
    if (p.canEdit) actions.appendChild(actionBtn('Replace file (resets approvals)…', 'secondary', function () { openNote('edit', item); }));
    if (p.canReopen) actions.appendChild(actionBtn('Reopen', 'secondary', function () { doReopen(item.id); }));
    if (p.canForce) {
      actions.appendChild(actionBtn('Force approve stage', 'secondary', function () { doForce(item.id); }));
      actions.appendChild(actionBtn('Skip stage', 'secondary', function () { doSkip(item.id); }));
    }
    if (p.canDelete) {
      actions.appendChild(actionBtn('Delete document', 'danger', function () { doDelete(item.id, item.title); }));
    }
    $('detailDialog').showModal();
  }

  function renderHistory(item) {
    var rows = (item.approvals || []).slice().reverse();
    if (!rows.length) return '';
    var html = '<h4 style="margin:1rem 0 0.4rem;font-size:0.95rem;">History</h4><ul style="margin:0;padding-left:1.1rem;color:var(--muted);font-size:0.88rem;">';
    rows.slice(0, 12).forEach(function (a) {
      var who = a.actor_name || a.display || a.actor_email || '';
      html += '<li><strong>' + escapeHtml(a.action) + '</strong> — ' + escapeHtml(who) +
        (a.note ? ' · ' + escapeHtml(a.note) : '') + '</li>';
    });
    html += '</ul>';
    return html;
  }

  function actionBtn(label, cls, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn ' + cls;
    b.textContent = label;
    b.addEventListener('click', function (e) {
      e.preventDefault();
      onClick();
    });
    return b;
  }

  function openNote(mode, item) {
    state.noteMode = mode;
    state.selected = item;
    $('noteTitle').textContent = mode === 'decline' ? 'Decline reason' : 'Replace document';
    $('noteLabel').textContent = mode === 'decline' ? 'Why is this declined?' : 'Optional note';
    $('noteText').value = '';
    $('noteText').required = mode === 'decline';
    $('replaceFileField').hidden = mode !== 'edit';
    $('replaceFile').value = '';
    $('replaceFile').required = mode === 'edit';
    $('detailDialog').close();
    $('noteDialog').showModal();
  }

  function doApprove(id) {
    $('detailDialog').close();
    run('apiApprove', id, '').then(refreshItems).catch(showError);
  }
  function doForce(id) {
    $('detailDialog').close();
    run('apiForceApprove', id, 'Admin force-approve').then(refreshItems).catch(showError);
  }
  function doSkip(id) {
    $('detailDialog').close();
    run('apiSkipStage', id, 'Admin skipped stage').then(refreshItems).catch(showError);
  }
  function doReopen(id) {
    $('detailDialog').close();
    run('apiReopen', id).then(refreshItems).catch(showError);
  }

  function doDelete(id, title) {
    if (!confirm('Delete “‘ + (title || id) + '”? This removes it from the workflow and trashes the Drive file.')) {
      return;
    }
    $('detailDialog').close();
    run('apiDeleteItem', id)
      .then(refreshItems)
      .catch(showError);
  }

  function refreshItems() {
    return run('apiListItems', {
      type: $('filterType').value || undefined,
      status: $('filterStatus').value || undefined
    }).then(function (data) {
      state.items = (data && data.items) || [];
      renderItems();
    });
  }

  function showError(err) {
    alert(err && err.message ? err.message : String(err));
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function escapeAttr(s) { return escapeHtml(s).replace(/'/g, '&#39;'); }

  function formatUserChip(ctx) {
    ctx = ctx || {};
    var roleLabels = {
      admin: 'Admin',
      chair: 'Chair',
      vice_chair: 'Vice Chair',
      secretary: 'Secretary',
      assistant_secretary: 'Assistant Secretary',
      patron: 'Patron',
      treasurer: 'Treasurer',
      members: 'Member'
    };
    var seen = {};
    var roles = [];
    (ctx.roles || []).forEach(function (r) {
      if (!r || seen[r]) return;
      seen[r] = true;
      roles.push(r);
    });
    // isAdmin is derived from admin role — do not append a second "admin"
    var labelText = roles.map(function (r) {
      return roleLabels[r] || r;
    }).join(', ');
    return (ctx.email || 'Unknown user') + (labelText ? ' · ' + labelText : '');
  }

  function switchAccount() {
    run('apiLogoutSession')
      .catch(function () { /* still show login form */ })
      .then(function () {
        showAuthBanner('Signed out. Enter the roster Gmail you want to use and request a login code.');
        $('userChip').textContent = 'Signed out';
        if ($('loginEmail')) $('loginEmail').focus();
      });
  }

  function applyBootstrap(data) {
    if (!data) throw new Error('No app data returned after login.');
    state.bootstrap = data;
    state.items = data.items || [];
    var ctx = data.context || {};
    applyBranding(data.branding || (data.setup && data.setup.branding));
    if ($('userChip')) $('userChip').textContent = formatUserChip(ctx);

    var setup = data.setup || {};
    try {
      renderSetupForm(setup);
      renderSubmitOptions(data.canSubmit || {});
    } catch (renderErr) {
      throw new Error('Could not render app: ' + (renderErr.message || renderErr));
    }

    // Only hide login after UI is ready — prevents blank screen on errors
    hideAuthBanner();
    if ($('viewLoading')) $('viewLoading').hidden = true;
    if ($('navTabs')) $('navTabs').hidden = false;

    if (!setup.setupDone) {
      if ($('tabSetup')) $('tabSetup').hidden = false;
      showView('setup');
      return;
    }

    if ($('tabSetup')) $('tabSetup').hidden = !ctx.isAdmin;
    showView('dashboard');
    renderItems();
  }
  window.applyBootstrap = applyBootstrap;
  window.hideAuthBanner = hideAuthBanner;
  window.showAuthBanner = showAuthBanner;

  function boot() {
    if ($('appMain')) $('appMain').hidden = true;
    if ($('navTabs')) $('navTabs').hidden = true;
    // Form is visible in HTML without JS — never hide it until OTP succeeds
    showAuthBanner();
    if (typeof INITIAL !== 'undefined' && INITIAL) {
      try {
        applyBranding(INITIAL.branding || {});
        if (INITIAL.accountChooserUrl && $('accountChooserLink')) {
          $('accountChooserLink').href = INITIAL.accountChooserUrl;
        }
      } catch (eBrand) {}
    }

    // After OTP, load app once. Do not auto-bootstrap on every visit (that hung after Drive wipe).
    var justLoggedIn = false;
    try {
      justLoggedIn = sessionStorage.getItem('naz_just_logged_in') === '1';
      if (justLoggedIn) sessionStorage.removeItem('naz_just_logged_in');
    } catch (e) {}

    run('apiGetPublicConfig')
      .then(function (pub) {
        if (pub && pub.branding) applyBranding(pub.branding);
        if (pub && pub.accountChooserUrl && $('accountChooserLink')) {
          $('accountChooserLink').href = pub.accountChooserUrl;
        }
        if (!pub || !pub.setupDone) {
          showAuthBanner(
            'Setup needed. Sign in with the group Gmail that owns this script, then Create Drive folders & database. ' +
            'If login fails after a Drive wipe, click Clear session first.'
          );
        } else {
          showAuthBanner('Enter your roster Gmail. Only registered users can sign in.');
        }
        if (justLoggedIn) {
          return run('apiGetBootstrap');
        }
        return null;
      })
      .then(function (data) {
        if (!data) return;
        applyBootstrap(data);
      })
      .catch(function (err) {
        finishBootError((err && err.message) || String(err));
      });
  }

  function bindLoginControls() {
    if (window.__nazLoginBound) return;
    window.__nazLoginBound = true;

    function bind(id, handler) {
      var el = $(id);
      if (!el || el.getAttribute('data-bound')) return;
      el.setAttribute('data-bound', '1');
      el.addEventListener('click', handler);
    }

    bind('btnSendLoginCode', function () {
      var email = ($('loginEmail').value || '').trim();
      setMsg($('loginMsg'), 'Sending code…', true);
      run('apiRequestLoginCode', email)
        .then(function () {
          setMsg($('loginMsg'), 'Code sent to ' + email + '. Check inbox (and spam).', true);
        })
        .catch(function (err) {
          setMsg($('loginMsg'), err.message || String(err), false);
        });
    });

    bind('btnVerifyLoginCode', function () {
      var email = ($('loginEmail').value || '').trim();
      var code = ($('loginCode').value || '').trim();
      setMsg($('loginMsg'), 'Verifying…', true);
      run('apiVerifyLoginCode', email, code)
        .then(function (res) {
          setMsg($('loginMsg'), 'Signed in. Opening Setup…', true);
          var data = res && res.bootstrap ? res.bootstrap : null;
          if (data) {
            applyBootstrap(data);
            return;
          }
          return run('apiGetBootstrap').then(applyBootstrap);
        })
        .catch(function (err) {
          showAuthBanner();
          setMsg($('loginMsg'), err.message || String(err), false);
        });
    });

    bind('btnSwitchAccount', function (e) {
      e.preventDefault();
      switchAccount();
    });

    bind('btnRetryAuth', function () {
      try { sessionStorage.removeItem('naz_auth_redirected'); } catch (e) {}
      boot();
    });

    bind('btnClearSession', function () {
      setMsg($('loginMsg'), 'Clearing…', true);
      run('apiResetStaleLinks')
        .then(function (res) {
          setMsg($('loginMsg'), (res && res.message) || 'Cleared. Request a new login code.', true);
          showAuthBanner(
            'Links cleared. Sign in with the group Gmail that owns the script, then Create Drive folders & database.'
          );
        })
        .catch(function (err) {
          setMsg($('loginMsg'), err.message || String(err), false);
        });
    });
  }

  // Bind login first so Setup/Dashboard wiring failures cannot disable Sign in
  bindLoginControls();

  try {
    document.querySelectorAll('.tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        showView(tab.getAttribute('data-view'));
      });
    });

    if ($('btnAddMember')) {
      $('btnAddMember').addEventListener('click', function () {
        $('membersList').appendChild(memberCard({ name: '', email: '', whatsapp: '' }, $('membersList').children.length));
        renumberMembers();
      });
    }

    if ($('logoFile')) {
      $('logoFile').addEventListener('change', function () {
        var file = $('logoFile').files[0];
        state.pendingLogo = null;
        if (!file) return;
        fileToPayload(file).then(function (p) {
          state.pendingLogo = p;
          applyBranding({
            orgName: $('brandTitle').textContent,
            slogan: $('orgSlogan').value,
            logoDataUrl: 'data:' + p.mimeType + ';base64,' + p.fileBase64
          });
        }).catch(showError);
      });
    }

    if ($('btnInitInfra')) {
      $('btnInitInfra').addEventListener('click', function () {
        setMsg($('setupMsg'), 'Creating folders & database…', true);
        run('apiRunInitialSetup')
          .then(function (res) { setMsg($('setupMsg'), res.message || 'Ready.', true); })
          .catch(function (err) { setMsg($('setupMsg'), err.message, false); });
      });
    }

    if ($('btnSaveRoles')) {
      $('btnSaveRoles').addEventListener('click', function () {
        setMsg($('setupMsg'), 'Saving…', true);
        var payload = {
          roles: collectRoles(),
          members: collectMembers(),
          webAppUrl: $('webAppUrl').value.trim(),
          orgSlogan: $('orgSlogan').value.trim(),
          whatsappMode: $('whatsappMode').value,
          whatsappWebhookUrl: $('whatsappWebhookUrl').value.trim()
        };
        if (state.pendingLogo) {
          payload.logoBase64 = state.pendingLogo.fileBase64;
          payload.logoFileName = state.pendingLogo.fileName;
          payload.logoMimeType = state.pendingLogo.mimeType;
        }
        run('apiSaveRoles', payload)
          .then(function () {
            setMsg($('setupMsg'), 'Saved. Reloading…', true);
            state.pendingLogo = null;
            return run('apiGetBootstrap');
          })
          .then(applyBootstrap)
          .catch(function (err) { setMsg($('setupMsg'), err.message, false); });
      });
    }

    if ($('btnRefresh')) {
      $('btnRefresh').addEventListener('click', function () {
        refreshItems().catch(showError);
      });
    }
    if ($('filterType')) $('filterType').addEventListener('change', renderItems);
    if ($('filterStatus')) $('filterStatus').addEventListener('change', renderItems);

    if ($('submitForm')) {
      $('submitForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var file = $('docFile').files[0];
        var btn = $('btnSubmit');
        btn.disabled = true;
        setMsg($('submitMsg'), 'Uploading…', true);
        fileToPayload(file)
          .then(function (filePayload) {
            return run('apiSubmitItem', {
              type: $('docType').value,
              title: $('docTitle').value.trim(),
              fileBase64: filePayload.fileBase64,
              fileName: filePayload.fileName,
              mimeType: filePayload.mimeType
            });
          })
          .then(function () {
            setMsg($('submitMsg'), 'Submitted. Notifications sent.', true);
            $('submitForm').reset();
            return run('apiGetBootstrap');
          })
          .then(applyBootstrap)
          .then(function () { showView('dashboard'); })
          .catch(function (err) { setMsg($('submitMsg'), err.message, false); })
          .then(function () { btn.disabled = false; });
      });
    }

    if ($('noteCancel')) {
      $('noteCancel').addEventListener('click', function () { $('noteDialog').close(); });
    }
    if ($('noteCancelBtn')) {
      $('noteCancelBtn').addEventListener('click', function () { $('noteDialog').close(); });
    }

    if ($('noteForm')) {
      $('noteForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var item = state.selected;
        if (!item) return;
        var mode = state.noteMode;
        var note = $('noteText').value.trim();
        var confirmBtn = $('noteConfirm');
        confirmBtn.disabled = true;
        var promise;
        if (mode === 'decline') {
          promise = run('apiDecline', item.id, note);
        } else if (mode === 'edit') {
          var file = $('replaceFile').files[0];
          promise = fileToPayload(file).then(function (fp) {
            return run('apiEditReplace', item.id, {
              fileBase64: fp.fileBase64,
              fileName: fp.fileName,
              mimeType: fp.mimeType,
              note: note
            });
          });
        } else {
          promise = Promise.reject(new Error('Unknown action'));
        }
        promise
          .then(function () {
            $('noteDialog').close();
            return refreshItems();
          })
          .catch(showError)
          .then(function () { confirmBtn.disabled = false; });
      });
    }

    boot();
  } catch (initErr) {
    showAuthBanner('Sign-in is ready. If a button fails, use Clear session then request a code. (' + (initErr.message || initErr) + ')');
  }
</script>
